# WBF.S4 — update watcher for the World Bank's Nepal Fiscal Dashboard.
#
# The dashboard updates roughly annually, so this is a low-frequency check, not
# an ingestion job: it writes nothing to the warehouse and needs no database
# secret. It re-harvests the nine federal aggregate series and compares them
# against the stored fingerprint in reference/wb-fiscal/watch_fingerprint.json.
#
# Why the data and not a "last updated" date: the dashboard publishes no
# crawlable last-updated string (established in S1, recorded in
# reference/wb-fiscal/PROVENANCE.md). A watcher pointed at a string that does
# not exist would never fire while looking like it was working.
#
# Quarterly, because annual publication plus a quarterly check means the data
# is at most one quarter stale, at a cost of four runs and ~36 requests a year.
#
# When it fires, it opens an issue rather than only failing: a red run is easy
# to miss months later, an assigned issue is not.

name: WB fiscal dashboard watch

on:
  schedule:
    # 07:00 UTC on the 1st of Jan/Apr/Jul/Oct (~12:45 Nepal time).
    - cron: "0 7 1 1,4,7,10 *"
  workflow_dispatch:        # allow a manual check from the Actions tab

permissions:
  contents: read
  issues: write             # only used on the "it changed" path

jobs:
  watch:
    name: Has the fiscal dashboard changed?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The watcher needs the request/parse path only — not the database or
      # storage stack the ingestion workflow installs.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compare the source against the stored fingerprint
        id: check
        continue-on-error: true
        run: |
          set +e
          python -m ingestion.worldbank.fiscal_watch | tee /tmp/watch.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Exit codes: 0 unchanged, 1 changed, 2 the check itself failed.
      - name: Open an issue if the source changed
        if: steps.check.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const detail = fs.readFileSync('/tmp/watch.txt', 'utf8');
            const title = 'World Bank fiscal dashboard has changed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'wb-fiscal-watch',
            });
            const body = [
              'The scheduled watcher found the Nepal Fiscal Dashboard is no longer',
              'what we last recorded.',
              '',
              '```',
              detail.trim(),
              '```',
              '',
              'Both loaders are idempotent, so re-running is safe and loads only',
              'what actually changed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['wb-fiscal-watch'],
              });
            }

      - name: Report the outcome
        run: |
          case "${{ steps.check.outputs.exit_code }}" in
            0) echo "No change — the dashboard matches the stored fingerprint." ;;
            1) echo "::warning::The dashboard changed; an issue has been opened."; exit 1 ;;
            *) echo "::error::The check could not run — see the log above."; exit 1 ;;
          esac
